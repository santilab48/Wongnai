[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DCORE_DEBUG_LEVEL=1
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.4.2

[env:lcdwiki_es3c28p_candidate]
extends = env:esp32s3
board = 4d_systems_esp32s3_gen4_r8n16
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags = ${env:esp32s3.build_flags} -DBOARD_LCDWIKI_ES3C28P
lib_deps = ${env:esp32s3.lib_deps}
  adafruit/Adafruit ILI9341@^1.6.2

[env:lcdwiki_es3c28p_diagnostic]
extends = env:lcdwiki_es3c28p_candidate
build_flags = ${env:lcdwiki_es3c28p_candidate.build_flags} -DLCDWIKI_DIAGNOSTIC
